<!doctype html>
<html lang="nl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Weather API</title></head>
<body><main><h1>Weather API</h1>
<form id="location"><label for="latitude">Breedtegraad</label><input id="latitude" type="number" step="any" min="-90" max="90" value="51.22" required>
<label for="longitude">Lengtegraad</label><input id="longitude" type="number" step="any" min="-180" max="180" value="4.4" required><button id="submit" type="submit">Toon voorspelling</button></form>
<p id="status" role="status"></p><table><thead><tr><th>Datum</th><th>Minimum (°C)</th><th>Maximum (°C)</th></tr></thead><tbody id="forecast"></tbody></table>
</main><script type="module" src="/src/main.ts"></script></body></html>
